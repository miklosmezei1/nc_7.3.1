{{- if eq .Values.EUROOFFICE_ENABLED "yes" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-eurooffice
  name: nextcloud-enterprise-eurooffice
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  selector:
    matchLabels:
      io.kompose.service: nextcloud-enterprise-eurooffice
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- if .Values.EUROOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.EUROOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations }}
        {{- toYaml .Values.EUROOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations | nindent 8 }}
        {{- end }}
        {{- end }}
        com.nextcloud.enterprise-aio.version: "v{{ .Chart.Version }}"
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        {{- if .Values.EUROOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.EUROOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels }}
        {{- toYaml .Values.EUROOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels | nindent 8 }}
        {{- end }}
        {{- end }}
        io.kompose.service: nextcloud-enterprise-eurooffice
    spec:
      {{- if .Values.SERVICE_ACCOUNT }}
      serviceAccountName: "{{ .Values.SERVICE_ACCOUNT }}"
      {{- end }}
      {{- if .Values.IMAGE_PULL_SECRET }}
      imagePullSecrets:
        - name: {{ .Values.IMAGE_PULL_SECRET }}
      {{- end }}
      initContainers:
        - name: init-volumes
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-alpine:20260609_115915"
          {{- if .Values.EUROOFFICE_RESOURCES }}
          resources:
            {{- toYaml .Values.EUROOFFICE_RESOURCES | nindent 12 }}
          {{- end }}
          command:
            - chmod
            - "777"
            - /nextcloud-enterprise-eurooffice
          volumeMounts:
            - name: nextcloud-enterprise-eurooffice
              mountPath: /nextcloud-enterprise-eurooffice
      containers:
        - env:
            - name: AIO_LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_HEADER
              value: AuthorizationJwt
            - name: JWT_SECRET
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.EUROOFFICE_SECRET }} 
                  key:  {{ .Values.EUROOFFICE_SECRET }} 
              {{- else }}
              value: {{ .Values.EUROOFFICE_SECRET | quote }}
              {{- end }}
            - name: LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: TZ
              value: "{{ .Values.TIMEZONE }}"
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-eurooffice:20260609_115915"
          {{- if .Values.EUROOFFICE_RESOURCES }}
          resources:
            {{- toYaml .Values.EUROOFFICE_RESOURCES | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 9
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 9
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
          name: nextcloud-enterprise-eurooffice
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/euro-office
              name: nextcloud-enterprise-eurooffice
      volumes:
        - name: nextcloud-enterprise-eurooffice
          {{- if (and .Values.NFS_SERVER (not (eq (.Values.USE_PVS | default "no") "yes"))) }}
          nfs:
            server: {{ .Values.NFS_SERVER }}
            path: "{{ .Values.NFS_PREFIX }}/nextcloud-enterprise-eurooffice"
          {{- else if .Values.HOST_PATH }}
          hostPath:
            path: {{ .Values.HOST_PATH }}/nextcloud-enterprise-eurooffice
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: nextcloud-enterprise-eurooffice
          {{- end }}
{{- end }}
