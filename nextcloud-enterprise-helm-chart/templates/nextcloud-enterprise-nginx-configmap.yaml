{{- if and .Values.nginx.enabled (eq .Values.nginx.existingServerBlockConfigmap "nextcloud-enterprise-nginx-configmap") }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-enterprise-nginx-configmap
  namespace: "{{ .Values.NAMESPACE }}"
data:
  nextcloud.conf: |
    # Nextcloud nginx configuration — root installation
    # Version 2026-06-09
    
    # PHP-FPM backend.
    upstream php-handler {
        # Use one of the options below, not both:
        server nextcloud-enterprise-nextcloud:9000;
        #server unix:/run/php/php8.2-fpm.sock;
    }
    
    # Set the `immutable` cache control options only for assets with a cache busting `v` argument
    map $arg_v $asset_immutable {
        "" "";
        default ", immutable";
    }
    
    server {
        listen 9000;
    
        # Prevent nginx HTTP Server Detection
        server_tokens off;
    
        # Enforce HTTPS
        # return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 8080;
        http2 on;
    
        # Path to the root of your installation
        root /var/www/html;
    
        # Use Mozilla's guidelines for SSL/TLS settings
        # https://mozilla.github.io/server-side-tls/ssl-config-generator/
        # ssl_certificate     /etc/ssl/nginx/cloud.example.com.crt;
        # ssl_certificate_key /etc/ssl/nginx/cloud.example.com.key;
    
        # Prevent nginx HTTP Server Detection
        server_tokens off;
    
        # HSTS settings
        # WARNING: Only add the preload option once you read about
        # the consequences in https://hstspreload.org/. This option
        # will add the domain to a hardcoded list that is shipped
        # in all major browsers and getting removed from this list
        # could take several months.
        {{- if eq .Values.NGINX_ENABLE_HSTS "yes" }}
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
        {{- end }}
    
        # set max upload size and increase upload timeout:
        client_max_body_size "{{ .Values.APACHE_MAX_SIZE }}";
        client_body_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
        fastcgi_buffers 64 4K;
    
        # Proxy and client response timeouts
        # Uncomment an increase these if facing timeout errors during large file uploads
        keepalive_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
        proxy_connect_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
        proxy_send_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
        proxy_read_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
        send_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
    
        # Enable gzip but do not remove ETag headers
        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 256;
        gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
        gzip_types application/atom+xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/rss+xml application/vnd.geo+json application/vnd.ms-fontobject application/wasm application/x-font-ttf application/x-web-app-manifest+json application/xhtml+xml application/xml font/opentype image/bmp image/svg+xml image/x-icon text/cache-manifest text/css text/plain text/vcard text/vnd.rim.location.xloc text/vtt text/x-component text/x-cross-domain-policy;
    
        # Pagespeed is not supported by Nextcloud, so if your server is built
        # with the `ngx_pagespeed` module, uncomment this line to disable it.
        #pagespeed off;
    
        # The settings allows you to optimize the HTTP2 bandwidth.
        # See https://blog.cloudflare.com/delivering-http-2-upload-speed-improvements/
        # for tuning hints
        client_body_buffer_size 512k;
    
        # HTTP response headers borrowed from Nextcloud `.htaccess`
        add_header Referrer-Policy                   "no-referrer"       always;
        add_header X-Content-Type-Options            "nosniff"           always;
        add_header X-Frame-Options                   "SAMEORIGIN"        always;
        add_header X-Permitted-Cross-Domain-Policies "none"              always;
        add_header X-Robots-Tag                      "noindex, nofollow" always;
    
        # Remove X-Powered-By, which is an information leak
        fastcgi_hide_header X-Powered-By;
    
        # Set .mjs and .wasm MIME types
        # Either include it in the default mime.types list
        # and include that list explicitly or add the file extension
        # only for Nextcloud like below:
        include mime.types;
        types {
            text/javascript mjs;
    	application/wasm wasm;
        }
    
        # Specify how to handle directories -- specifying `/index.php$request_uri`
        # here as the fallback means that Nginx always exhibits the desired behaviour
        # when a client requests a path that corresponds to a directory that exists
        # on the server. In particular, if that directory contains an index.php file,
        # that file is correctly served; if it doesn't, then the request is passed to
        # the front-end controller. This consistent behaviour means that we don't need
        # to specify custom rules for certain paths (e.g. images and other assets,
        # `/updater`, `/ocs-provider`), and thus
        # `try_files $uri $uri/ /index.php$request_uri`
        # always provides the desired behaviour.
        index index.php index.html /index.php$request_uri;
        # Config for notify-push
        location ^~ /push/ {
            proxy_pass http://nextcloud-enterprise-notify-push:7867/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    
        {{- if and (eq .Values.COLLABORA_HOST "nextcloud-enterprise-collabora") (eq .Values.COLLABORA_ENABLED "yes") }}
        # Config for Collabora
        # static files
        location ^~ /browser {
            proxy_pass http://nextcloud-enterprise-collabora:9980;
            proxy_set_header Host $host;
        }
        # WOPI discovery URL
        location ^~ /hosting/discovery {
            proxy_pass http://nextcloud-enterprise-collabora:9980;
            proxy_set_header Host $host;
        }
        # Capabilities
        location ^~ /hosting/capabilities {
            proxy_pass http://nextcloud-enterprise-collabora:9980;
            proxy_set_header Host $host;
        }
        # main websocket
        location ~ ^/cool/(.*)/ws$ {
            proxy_pass http://nextcloud-enterprise-collabora:9980;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 36000s;
        }
        # download, presentation and image upload
        location ~ ^/(c|l)ool {
            proxy_pass http://nextcloud-enterprise-collabora:9980;
            proxy_set_header Host $host;
        }
        # Admin Console websocket
        location ^~ /cool/adminws {
            proxy_pass http://nextcloud-enterprise-collabora:9980;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 36000s;
        }
        {{- end }}
    
        {{- if and (eq .Values.TALK_HOST "nextcloud-enterprise-talk") (eq .Values.TALK_ENABLED "yes") }}
        # Config for Talk
        location /standalone-signaling/ {
            proxy_pass http://nextcloud-enterprise-talk:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
        {{- end }}
    
        {{- if eq .Values.WHITEBOARD_ENABLED "yes" }}
        # Config for Whiteboard
        location /whiteboard/ {
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            
            proxy_pass http://nextcloud-enterprise-whiteboard:3002/;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
        {{- end }}
    
        {{- if and (eq (.Values.ONLYOFFICE_HOST | default "nextcloud-enterprise-onlyoffice") "nextcloud-enterprise-onlyoffice") (eq .Values.ONLYOFFICE_ENABLED "yes") }}
        # Config for OnlyOffice
        location /onlyoffice/ {
            proxy_pass http://nextcloud-enterprise-onlyoffice:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $host/onlyoffice;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        {{- end }}
    
        {{- if (eq .Values.EUROOFFICE_ENABLED "yes") }}
        # Config for EuroOffice
        location /eurooffice/ {
            proxy_pass http://nextcloud-enterprise-eurooffice:80;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /eurooffice;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        {{- end }}
    
    
        # Rule borrowed from `.htaccess` to handle Microsoft DAV clients
        location = / {
            if ( $http_user_agent ~ ^DavClnt ) {
                return 302 /remote.php/webdav/$is_args$args;
            }
        }
    
        location = /robots.txt {
            allow all;
            log_not_found off;
            access_log off;
        }
    
        # Make a regex exception for `/.well-known` so that clients can still
        # access it despite the existence of the regex rule
        # `location ~ /(\.|autotest|...)` which would otherwise handle requests
        # for `/.well-known`.
        location ^~ /.well-known {
            # The rules in this block are an adaptation of the rules
            # in `.htaccess` that concern `/.well-known`.
    
            location = /.well-known/carddav { return 301 /remote.php/dav/; }
            location = /.well-known/caldav  { return 301 /remote.php/dav/; }
    
            location /.well-known/acme-challenge    { try_files $uri $uri/ =404; }
            location /.well-known/pki-validation    { try_files $uri $uri/ =404; }
    
            # Let Nextcloud's API for `/.well-known` URIs handle all other
            # requests by passing them to the front-end controller.
            return 301 /index.php$request_uri;
        }
    
        # Rules borrowed from `.htaccess` to hide certain paths from clients
        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/)  { return 404; }
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console)                { return 404; }
    
        # Hide metadata files which would otherwise be served as plain files and
        # leak dependency information (composer.json, package.json, core/shipped.json).
        location ~ ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|core/shipped\.json)$ { return 404; }
    
        # Pass PHP requests to PHP-FPM.
        #
        # Important: this block must appear above the static asset locations
        # below. Those locations fall back to `/index.php$request_uri`; if
        # they appear first, nginx can repeatedly rewrite to `/index.php`,
        # causing an internal redirection loop.
        location ~ \.php(?:$|/) {
            # Rewrite most PHP requests to Nextcloud's front controller (`/index.php`).
            #
            # (Mirrors the rewrite exceptions in Nextcloud's Apache .htaccess.)
            #
            # Exceptions (not rewritten; must remain directly reachable):
            #   index.php, remote.php, public.php, cron.php, status.php
            #   ocs/v1.php, ocs/v2.php, ocs-provider/*
            #   core/ajax/update.php, updater/*
            #   */richdocumentscode(_arm64)?/proxy
            #
            # Other exceptions (e.g. /.well-known) are handled by dedicated
            # location blocks elsewhere in this config.
            #
            # Caution: small edits to this regex can break routing or introduce
            # rewrite loops.
            rewrite ^/(?!index|remote|public|cron|status|ocs\/v[12]|ocs-provider\/.+|core\/ajax\/update|updater\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;
    
            # Split `/file.php/path/info` into:
            # - $fastcgi_script_name: `/file.php`
            # - $fastcgi_path_info:   `/path/info`
            #
            # This is required for entry-points such as `remote.php` and `public.php`,
            # which route requests based on PATH_INFO.
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            set $path_info $fastcgi_path_info;    # Save before try_files resets it
    
            # Return 404 for nonexistent PHP scripts (avoids passing arbitrary
            # paths to PHP-FPM, which is a known security risk).
            try_files $fastcgi_script_name =404;
    
            include fastcgi_params;
            fastcgi_pass php-handler;
    
            fastcgi_param SCRIPT_FILENAME            $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO                  $path_info;
            fastcgi_param modHeadersAvailable        true;     # Avoid duplicate security headers
            fastcgi_param front_controller_active    true;     # Enable pretty URLs
    
            # Let nginx handle HTTP error responses from PHP-FPM (e.g. custom
            # error pages). Disable for debugging if PHP errors are being hidden.
            fastcgi_intercept_errors on;
    
            # Required for uploads: PHP-FPM does not support chunked
            # transfer encoding and needs a Content-Length header.
            fastcgi_request_buffering on;
    
            # Optional PHP-FPM timeout tuning (e.g. for 504 response timeouts).
            # Increase these only if uploads or long-running PHP requests are
            # timing out in your environment.
            fastcgi_read_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
            fastcgi_send_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
            fastcgi_connect_timeout {{ .Values.NEXTCLOUD_MAX_TIME }}s;
    
            # Disable on-disk buffering of FastCGI responses (reduces disk I/O at
            # the cost of holding responses in memory).
            fastcgi_max_temp_file_size 0;
        }
    
        # Serve static files
        location ~ \.(?:css|js|mjs|svg|gif|ico|jpg|png|webp|wasm|tflite|map|ogg|flac|mp4|webm)$ {
            try_files $uri /index.php$request_uri;
            # HTTP response headers borrowed from Nextcloud `.htaccess`
            add_header Cache-Control                     "public, max-age=15778463$asset_immutable";
            add_header Referrer-Policy                   "no-referrer"       always;
            add_header X-Content-Type-Options            "nosniff"           always;
            add_header X-Frame-Options                   "SAMEORIGIN"        always;
            add_header X-Permitted-Cross-Domain-Policies "none"              always;
            add_header X-Robots-Tag                      "noindex, nofollow" always;
            access_log off;     # Optional: Don't log access to assets
        }
    
        location ~ \.(otf|woff2?)$ {
            try_files $uri /index.php$request_uri;
            expires 7d;         # Cache-Control policy borrowed from `.htaccess`
            access_log off;     # Optional: Don't log access to assets
        }
    
        # Rule borrowed from `.htaccess`
        location /remote {
            return 301 /remote.php$request_uri;
        }
    
        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
{{- end }}
