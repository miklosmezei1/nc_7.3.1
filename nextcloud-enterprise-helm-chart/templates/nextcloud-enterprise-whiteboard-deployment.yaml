{{- if eq .Values.WHITEBOARD_ENABLED "yes" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-whiteboard
  name: nextcloud-enterprise-whiteboard
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  selector:
    matchLabels:
      io.kompose.service: nextcloud-enterprise-whiteboard
  template:
    metadata:
      annotations:
        {{- if .Values.WHITEBOARD_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.WHITEBOARD_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations }}
        {{- toYaml .Values.WHITEBOARD_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations | nindent 8 }}
        {{- end }}
        {{- end }}
        com.nextcloud.enterprise-aio.version: "v{{ .Chart.Version }}"
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        {{- if .Values.WHITEBOARD_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.WHITEBOARD_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels }}
        {{- toYaml .Values.WHITEBOARD_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels | nindent 8 }}
        {{- end }}
        {{- end }}
        io.kompose.service: nextcloud-enterprise-whiteboard
    spec:
      {{- if .Values.SERVICE_ACCOUNT }}
      serviceAccountName: "{{ .Values.SERVICE_ACCOUNT }}"
      {{- end }}
      {{- if .Values.IMAGE_PULL_SECRET }}
      imagePullSecrets:
        - name: {{ .Values.IMAGE_PULL_SECRET }}
      {{- end }}
      securityContext:
        # The items below only work in pod context
        fsGroup: {{ .Values.WHITEBOARD_UGID | default 65534 }}
        fsGroupChangePolicy: "OnRootMismatch"
        # The items below work in both contexts
        runAsUser: {{ .Values.WHITEBOARD_UGID | default 65534 }}
        runAsGroup: {{ .Values.WHITEBOARD_UGID | default 65534 }}
        runAsNonRoot: true
        {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      containers:
        - env:
            - name: REDIS_DB_INDEX
              value: "{{ .Values.REDIS_DB_INDEX }}"
            - name: REDIS_USER
              value: "{{ .Values.REDIS_USER }}"
            - name: AIO_LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: BACKUP_DIR
              value: /tmp
            - name: JWT_SECRET_KEY
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.WHITEBOARD_SECRET }} 
                  key:  {{ .Values.WHITEBOARD_SECRET }} 
              {{- else }}
              value: {{ .Values.WHITEBOARD_SECRET | quote }}
              {{- end }}
            - name: NEXTCLOUD_URL
              value: https://{{ .Values.NC_DOMAIN }}
            - name: REDIS_HOST
              value: "{{ .Values.REDIS_HOST }}"
            - name: REDIS_HOST_PASSWORD
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.REDIS_PASSWORD }} 
                  key:  {{ .Values.REDIS_PASSWORD }} 
              {{- else }}
              value: {{ .Values.REDIS_PASSWORD | quote }}
              {{- end }}
            - name: REDIS_PORT
              value: "{{ .Values.REDIS_PORT | default "6379" }}"
            - name: STORAGE_STRATEGY
              value: redis
            - name: TZ
              value: "{{ .Values.TIMEZONE }}"
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-whiteboard:20260609_115915"
          {{- if .Values.WHITEBOARD_RESOURCES }}
          resources:
            {{- toYaml .Values.WHITEBOARD_RESOURCES | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 30
          name: nextcloud-enterprise-whiteboard
          ports:
            - containerPort: 3002
              protocol: TCP
          securityContext:
            # The items below only work in container context
            allowPrivilegeEscalation: false
            capabilities:
              {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
              drop: ["ALL"]
              {{- else }}
              drop: ["NET_RAW"]
              {{- end }}
{{- end }}
