{{- if eq .Values.CLAMAV_ENABLED "yes" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-clamav
  name: nextcloud-enterprise-clamav
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  selector:
    matchLabels:
      io.kompose.service: nextcloud-enterprise-clamav
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- if .Values.CLAMAV_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.CLAMAV_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations }}
        {{- toYaml .Values.CLAMAV_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations | nindent 8 }}
        {{- end }}
        {{- end }}
        com.nextcloud.enterprise-aio.version: "v{{ .Chart.Version }}"
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        {{- if .Values.CLAMAV_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.CLAMAV_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels }}
        {{- toYaml .Values.CLAMAV_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels | nindent 8 }}
        {{- end }}
        {{- end }}
        io.kompose.service: nextcloud-enterprise-clamav
    spec:
      {{- if .Values.SERVICE_ACCOUNT }}
      serviceAccountName: "{{ .Values.SERVICE_ACCOUNT }}"
      {{- end }}
      {{- if .Values.IMAGE_PULL_SECRET }}
      imagePullSecrets:
        - name: {{ .Values.IMAGE_PULL_SECRET }}
      {{- end }}
      securityContext:
        # The items below only work in pod context
        fsGroup: {{ .Values.CLAMAV_UGID | default 100 }}
        fsGroupChangePolicy: "OnRootMismatch"
        # The items below work in both contexts
        runAsUser: {{ .Values.CLAMAV_UGID | default 100 }}
        runAsGroup: {{ .Values.CLAMAV_UGID | default 100 }}
        runAsNonRoot: true
        {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      initContainers:
        - name: init-subpath
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-alpine:20260609_115915"
          {{- if .Values.CLAMAV_RESOURCES }}
          resources:
            {{- toYaml .Values.CLAMAV_RESOURCES | nindent 12 }}
          {{- end }}
          command:
            - mkdir
            - "-p"
            - /nextcloud-enterprise-clamav/data
          volumeMounts:
            - name: nextcloud-enterprise-clamav
              mountPath: /nextcloud-enterprise-clamav
          securityContext:
            # The items below only work in container context
            allowPrivilegeEscalation: false
            capabilities:
              {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
              drop: ["ALL"]
              {{- else }}
              drop: ["NET_RAW"]
              {{- end }}
      containers:
        - env:
            - name: AIO_LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: MAX_SIZE
              value: "{{ .Values.NEXTCLOUD_UPLOAD_LIMIT }}"
            - name: TZ
              value: "{{ .Values.TIMEZONE }}"
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-clamav:20260609_115915"
          {{- if .Values.CLAMAV_RESOURCES }}
          resources:
            {{- toYaml .Values.CLAMAV_RESOURCES | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 9
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 9
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
          name: nextcloud-enterprise-clamav
          ports:
            - containerPort: 3310
              protocol: TCP
          securityContext:
            # The items below only work in container context
            allowPrivilegeEscalation: false
            capabilities:
              {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
              drop: ["ALL"]
              {{- else }}
              drop: ["NET_RAW"]
              {{- end }}
          volumeMounts:
            - mountPath: /var/lib/clamav
              subPath: data
              name: nextcloud-enterprise-clamav
      volumes:
        - name: nextcloud-enterprise-clamav
          {{- if (and .Values.NFS_SERVER (not (eq (.Values.USE_PVS | default "no") "yes"))) }}
          nfs:
            server: {{ .Values.NFS_SERVER }}
            path: "{{ .Values.NFS_PREFIX }}/nextcloud-enterprise-clamav"
          {{- else if .Values.HOST_PATH }}
          hostPath:
            path: {{ .Values.HOST_PATH }}/nextcloud-enterprise-clamav
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: nextcloud-enterprise-clamav
          {{- end }}
{{- end }}
