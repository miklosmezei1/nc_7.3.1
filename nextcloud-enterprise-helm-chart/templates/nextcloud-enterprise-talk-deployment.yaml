{{- if and (eq .Values.TALK_HOST "nextcloud-enterprise-talk") (eq .Values.TALK_ENABLED "yes") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-talk
  name: nextcloud-enterprise-talk
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  selector:
    matchLabels:
      io.kompose.service: nextcloud-enterprise-talk
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- if .Values.TALK_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.TALK_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations }}
        {{- toYaml .Values.TALK_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations | nindent 8 }}
        {{- end }}
        {{- end }}
        com.nextcloud.enterprise-aio.version: "v{{ .Chart.Version }}"
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        {{- if .Values.TALK_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.TALK_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels }}
        {{- toYaml .Values.TALK_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels | nindent 8 }}
        {{- end }}
        {{- end }}
        io.kompose.service: nextcloud-enterprise-talk
    spec:
      {{- if .Values.SERVICE_ACCOUNT }}
      serviceAccountName: "{{ .Values.SERVICE_ACCOUNT }}"
      {{- end }}
      {{- if .Values.IMAGE_PULL_SECRET }}
      imagePullSecrets:
        - name: {{ .Values.IMAGE_PULL_SECRET }}
      {{- end }}
      securityContext:
        # The items below only work in pod context
        fsGroup: {{ .Values.TALK_UGID | default 1000 }}
        fsGroupChangePolicy: "OnRootMismatch"
        # The items below work in both contexts
        runAsUser: {{ .Values.TALK_UGID | default 1000 }}
        runAsGroup: {{ .Values.TALK_UGID | default 1000 }}
        runAsNonRoot: true
        {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
        seccompProfile:
          type: RuntimeDefault
          {{- end }}
      containers:
        - env:
            - name: TALK_MAX_STREAM_BITRATE
              value: "{{ .Values.TALK_MAX_STREAM_BITRATE }}"
            - name: TALK_MAX_SCREEN_BITRATE
              value: "{{ .Values.TALK_MAX_SCREEN_BITRATE }}"
            - name: AIO_LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: INTERNAL_SECRET
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.TALK_INTERNAL_SECRET }} 
                  key:  {{ .Values.TALK_INTERNAL_SECRET }} 
              {{- else }}
              value: {{ .Values.TALK_INTERNAL_SECRET | quote }}
              {{- end }}
            - name: NC_DOMAIN
              value: "{{ .Values.NC_DOMAIN }}"
            - name: SIGNALING_SECRET
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.SIGNALING_SECRET }} 
                  key:  {{ .Values.SIGNALING_SECRET }} 
              {{- else }}
              value: {{ .Values.SIGNALING_SECRET | quote }}
              {{- end }}
            - name: TALK_HOST
              value: nextcloud-enterprise-talk
            - name: TALK_PORT
              value: "{{ .Values.TALK_PORT }}"
            - name: TURN_SECRET
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.TURN_SECRET }} 
                  key:  {{ .Values.TURN_SECRET }} 
              {{- else }}
              value: {{ .Values.TURN_SECRET | quote }}
              {{- end }}
            - name: TZ
              value: "{{ .Values.TIMEZONE }}"
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-talk:20260609_115915"
          {{- if .Values.TALK_RESOURCES }}
          resources:
            {{- toYaml .Values.TALK_RESOURCES | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 3
            periodSeconds: 30
            timeoutSeconds: 30
          name: nextcloud-enterprise-talk
          ports:
            - containerPort: {{ .Values.TALK_PORT }}
              protocol: TCP
            - containerPort: {{ .Values.TALK_PORT }}
              protocol: UDP
            - containerPort: 8081
              protocol: TCP
          securityContext:
            # The items below only work in container context
            allowPrivilegeEscalation: false
            capabilities:
              {{- if eq (.Values.RPSS_ENABLED | default "no") "yes" }}
              drop: ["ALL"]
              {{- else }}
              drop: ["NET_RAW"]
              {{- end }}
{{- end }}
