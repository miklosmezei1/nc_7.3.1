{{- if (or (eq (.Values.USE_PVS | default "no") "yes") (not (or .Values.NFS_SERVER .Values.HOST_PATH))) }}
{{- if and (eq (.Values.FULLTEXTSEARCH_HOST | default "nextcloud-enterprise-fulltextsearch") "nextcloud-enterprise-fulltextsearch") (eq .Values.FULLTEXTSEARCH_ENABLED "yes") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    io.kompose.service: nextcloud-enterprise-elasticsearch
    {{- if .Values.PVC_LABELS }}
    {{- toYaml .Values.PVC_LABELS | nindent 4 }}
    {{- end }}
  name: nextcloud-enterprise-elasticsearch
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  {{- if .Values.STORAGE_CLASS }}
  storageClassName: {{ .Values.STORAGE_CLASS }}
  {{- end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ELASTICSEARCH_STORAGE_SIZE }}
  {{- if eq (.Values.USE_PVS | default "no") "yes" }}
  volumeName: "nextcloud-enterprise-elasticsearch-{{ .Values.NAMESPACE }}"
  {{- end }}
{{- if eq (.Values.USE_PVS | default "no") "yes" }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "nextcloud-enterprise-elasticsearch-{{ .Values.NAMESPACE }}"
  {{- if .Values.PVC_LABELS }}
  labels:
    {{- toYaml .Values.PVC_LABELS | nindent 4 }}
  {{- end }}
spec:
  storageClassName: {{ .Values.STORAGE_CLASS }}
  capacity:
      storage: {{ .Values.ELASTICSEARCH_STORAGE_SIZE }}
  accessModes:
    - ReadWriteOnce
  nfs:
    path: "{{ .Values.NFS_PREFIX }}/nextcloud-enterprise-elasticsearch"
    server: "{{ .Values.NFS_SERVER }}"
{{- end }}
{{- end }}
{{- end }}
