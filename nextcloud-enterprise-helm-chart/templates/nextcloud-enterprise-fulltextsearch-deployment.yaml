{{- if and (eq (.Values.FULLTEXTSEARCH_HOST | default "nextcloud-enterprise-fulltextsearch") "nextcloud-enterprise-fulltextsearch") (eq .Values.FULLTEXTSEARCH_ENABLED "yes") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-fulltextsearch
  name: nextcloud-enterprise-fulltextsearch
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  selector:
    matchLabels:
      io.kompose.service: nextcloud-enterprise-fulltextsearch
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- if .Values.FULLTEXTSEARCH_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.FULLTEXTSEARCH_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations }}
        {{- toYaml .Values.FULLTEXTSEARCH_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations | nindent 8 }}
        {{- end }}
        {{- end }}
        com.nextcloud.enterprise-aio.version: "v{{ .Chart.Version }}"
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        {{- if .Values.FULLTEXTSEARCH_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.FULLTEXTSEARCH_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels }}
        {{- toYaml .Values.FULLTEXTSEARCH_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels | nindent 8 }}
        {{- end }}
        {{- end }}
        io.kompose.service: nextcloud-enterprise-fulltextsearch
    spec:
      {{- if .Values.SERVICE_ACCOUNT }}
      serviceAccountName: "{{ .Values.SERVICE_ACCOUNT }}"
      {{- end }}
      {{- if .Values.IMAGE_PULL_SECRET }}
      imagePullSecrets:
        - name: {{ .Values.IMAGE_PULL_SECRET }}
      {{- end }}
      initContainers:
        - name: init-volumes
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-alpine:20260609_115915"
          {{- if .Values.FULLTEXTSEARCH_RESOURCES }}
          resources:
            {{- toYaml .Values.FULLTEXTSEARCH_RESOURCES | nindent 12 }}
          {{- end }}
          command:
            - chmod
            - "777"
            - /nextcloud-enterprise-elasticsearch
          volumeMounts:
            - name: nextcloud-enterprise-elasticsearch
              mountPath: /nextcloud-enterprise-elasticsearch
      containers:
        - env:
            - name: AIO_LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: ELASTIC_PASSWORD
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.FULLTEXTSEARCH_PASSWORD }} 
                  key:  {{ .Values.FULLTEXTSEARCH_PASSWORD }} 
              {{- else }}
              value: {{ .Values.FULLTEXTSEARCH_PASSWORD | quote }}
              {{- end }}
            - name: ES_JAVA_OPTS
              value: "{{ .Values.FULLTEXTSEARCH_JAVA_OPTIONS | default "-Xms512M -Xmx512M" }}"
            - name: TZ
              value: "{{ .Values.TIMEZONE }}"
            - name: bootstrap.memory_lock
              value: "false"
            - name: cluster.name
              value: nextcloud-enterprise
            - name: discovery.type
              value: single-node
            - name: http.port
              value: "9200"
            - name: indices.fielddata.cache.size
              value: 20%
            - name: indices.memory.index_buffer_size
              value: 20%
            - name: thread_pool.write.queue_size
              value: "1000"
            - name: xpack.license.self_generated.type
              value: basic
            - name: xpack.security.enabled
              value: "true"
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-fulltextsearch:20260609_115915"
          {{- if .Values.FULLTEXTSEARCH_RESOURCES }}
          resources:
            {{- toYaml .Values.FULLTEXTSEARCH_RESOURCES | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 5
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 5
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          name: nextcloud-enterprise-fulltextsearch
          ports:
            - containerPort: 9200
              protocol: TCP
          volumeMounts:
            - mountPath: /usr/share/elasticsearch/data
              name: nextcloud-enterprise-elasticsearch
      volumes:
        - name: nextcloud-enterprise-elasticsearch
          {{- if (and .Values.NFS_SERVER (not (eq (.Values.USE_PVS | default "no") "yes"))) }}
          nfs:
            server: {{ .Values.NFS_SERVER }}
            path: "{{ .Values.NFS_PREFIX }}/nextcloud-enterprise-elasticsearch"
          {{- else if .Values.HOST_PATH }}
          hostPath:
            path: {{ .Values.HOST_PATH }}/nextcloud-enterprise-elasticsearch
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: nextcloud-enterprise-elasticsearch
          {{- end }}
{{- end }}
