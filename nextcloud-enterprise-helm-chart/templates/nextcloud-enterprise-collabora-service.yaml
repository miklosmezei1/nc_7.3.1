{{- if and (eq .Values.COLLABORA_HOST "nextcloud-enterprise-collabora") (eq .Values.COLLABORA_ENABLED "yes") }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-collabora
  name: nextcloud-enterprise-collabora
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  ipFamilyPolicy: PreferDualStack
  ports:
    - name: "9980"
      port: 9980
      targetPort: 9980
  selector:
    io.kompose.service: nextcloud-enterprise-collabora
{{- end }}
