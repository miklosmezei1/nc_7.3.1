{{- if and (eq (.Values.ONLYOFFICE_HOST | default "nextcloud-enterprise-onlyoffice") "nextcloud-enterprise-onlyoffice") (eq .Values.ONLYOFFICE_ENABLED "yes") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: nextcloud-enterprise-onlyoffice
  name: nextcloud-enterprise-onlyoffice
  namespace: "{{ .Values.NAMESPACE }}"
spec:
  selector:
    matchLabels:
      io.kompose.service: nextcloud-enterprise-onlyoffice
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        {{- if .Values.ONLYOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.ONLYOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations }}
        {{- toYaml .Values.ONLYOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.annotations | nindent 8 }}
        {{- end }}
        {{- end }}
        com.nextcloud.enterprise-aio.version: "v{{ .Chart.Version }}"
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        {{- if .Values.ONLYOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS }}
        {{- if .Values.ONLYOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels }}
        {{- toYaml .Values.ONLYOFFICE_ADDITIONAL_ANNOTATIONS_AND_LABELS.labels | nindent 8 }}
        {{- end }}
        {{- end }}
        io.kompose.service: nextcloud-enterprise-onlyoffice
    spec:
      {{- if .Values.SERVICE_ACCOUNT }}
      serviceAccountName: "{{ .Values.SERVICE_ACCOUNT }}"
      {{- end }}
      {{- if .Values.IMAGE_PULL_SECRET }}
      imagePullSecrets:
        - name: {{ .Values.IMAGE_PULL_SECRET }}
      {{- end }}
      initContainers:
        - name: init-volumes
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-alpine:20260609_115915"
          {{- if .Values.ONLYOFFICE_RESOURCES }}
          resources:
            {{- toYaml .Values.ONLYOFFICE_RESOURCES | nindent 12 }}
          {{- end }}
          command:
            - chmod
            - "777"
            - /nextcloud-enterprise-onlyoffice
          volumeMounts:
            - name: nextcloud-enterprise-onlyoffice
              mountPath: /nextcloud-enterprise-onlyoffice
      containers:
        - env:
            - name: AIO_LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_HEADER
              value: AuthorizationJwt
            - name: JWT_SECRET
              {{- if eq (.Values.USE_SECRETS | default "no") "yes" }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ONLYOFFICE_SECRET }} 
                  key:  {{ .Values.ONLYOFFICE_SECRET }} 
              {{- else }}
              value: {{ .Values.ONLYOFFICE_SECRET | quote }}
              {{- end }}
            - name: LOG_LEVEL
              value: "{{ .Values.AIO_LOG_LEVEL }}"
            - name: TZ
              value: "{{ .Values.TIMEZONE }}"
          image: "{{ .Values.IMAGE_MIRROR_PREFIX }}{{ .Values.NEXTCLOUD_IMAGE_ORG }}/aio-onlyoffice:20260609_115915"
          {{- if .Values.ONLYOFFICE_RESOURCES }}
          resources:
            {{- toYaml .Values.ONLYOFFICE_RESOURCES | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 9
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - /healthcheck.sh
            failureThreshold: 9
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 30
          name: nextcloud-enterprise-onlyoffice
          ports:
            - containerPort: 80
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/onlyoffice
              name: nextcloud-enterprise-onlyoffice
      volumes:
        - name: nextcloud-enterprise-onlyoffice
          {{- if (and .Values.NFS_SERVER (not (eq (.Values.USE_PVS | default "no") "yes"))) }}
          nfs:
            server: {{ .Values.NFS_SERVER }}
            path: "{{ .Values.NFS_PREFIX }}/nextcloud-enterprise-onlyoffice"
          {{- else if .Values.HOST_PATH }}
          hostPath:
            path: {{ .Values.HOST_PATH }}/nextcloud-enterprise-onlyoffice
            type: Directory
          {{- else }}
          persistentVolumeClaim:
            claimName: nextcloud-enterprise-onlyoffice
          {{- end }}
{{- end }}
