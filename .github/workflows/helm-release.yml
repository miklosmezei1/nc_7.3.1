name: Helm Chart Releaser

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'nextcloud-enterprise-helm-chart/**'

permissions: {}

jobs:
  get_current_release:
    permissions:
      contents: read
    runs-on: self-hosted
    outputs:
      output1: ${{ steps.release.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Set current release as env variable
        id: release
        run: |
          set -ex
          git fetch --prune --unshallow
          version=$(git tag -l | grep -v nextcloud-enterprise-helm-chart | grep -v beta | sort -r | head -1 | sed 's|^v||')
          echo "release=$version" >> $GITHUB_OUTPUT

  release:
    needs: get_current_release
    permissions:
      actions: read
      contents: write
      issues: write
      packages: write
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Turnstyle
        uses: softprops/turnstyle@fa86562458e34a9067f0dc1316a76b3975b1c413 # v2
        with:
          continue-after-seconds: 180
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}

      - name: Fetch history
        run: git fetch --prune --unshallow

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # See https://github.com/helm/chart-releaser-action/issues/6
      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.11.1

      - name: Run Helm Lint
        run: |
          rm nextcloud-enterprise-helm-chart/values.schema.json
          helm lint ./nextcloud-enterprise-helm-chart

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          mark_as_latest: true
          charts_dir: .
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_RELEASE_NAME_TEMPLATE: "v{{ .Version }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_SKIP_EXISTING: true

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: docker.pkg.github.com
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push Charts to ghcr.io
        id: push-to-ghcr
        run: |
          set -ex
          RELEASE_VERSION="${{ needs.get_current_release.outputs.output1 }}"
          CHART_VERSION="$(grep '^version:' ./nextcloud-enterprise-helm-chart/Chart.yaml | sed 's|version: ||')"
          if echo "$CHART_VERSION" | grep -q beta || [ "$CHART_VERSION" = "$RELEASE_VERSION" ]; then
            exit 0
          fi
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            helm push "${pkg}" oci://ghcr.io/nextcloud-gmbh
            echo "pushed=yes" >> $GITHUB_OUTPUT
            echo "CHART_VERSION=$CHART_VERSION" >> $GITHUB_OUTPUT
          done
