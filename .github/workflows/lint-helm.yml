name: Lint Helm Charts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'nextcloud-enterprise-helm-chart/**'
  push:
    branches:
      - main
    paths:
      - 'nextcloud-enterprise-helm-chart/**'

permissions:
  contents: read

jobs:
  lint-helm:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.11.1

      - name: Install yq
        run: |
          wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Adjust values
        run: |
          yq -i '
            .DATABASE_PASSWORD = "secret" |
            .EUROOFFICE_SECRET = "secret" |
            .FULLTEXTSEARCH_PASSWORD = "secret" |
            .IMAGINARY_SECRET = "secret" |
            .NEXTCLOUD_PASSWORD = "secret" |
            .ONLYOFFICE_SECRET = "secret" |
            .RECORDING_SECRET = "secret" |
            .REDIS_PASSWORD = "secret" |
            .SIGNALING_SECRET = "secret" |
            .TALK_INTERNAL_SECRET = "secret" |
            .TURN_SECRET = "secret" |
            .WHITEBOARD_SECRET = "secret"
          ' nextcloud-enterprise-helm-chart/values.yaml

      - name: Lint charts
        run: |
          helm lint nextcloud-enterprise-helm-chart
