name: Build docker images

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - 'Containers/nextcloud/**'
    - 'Containers/nextcloud-management/**'
    - 'Containers/nginx/**'

permissions: {}

jobs:
  get_time:
    runs-on: self-hosted
    outputs:
      output1: ${{ steps.date.outputs.date }}
    steps:
      - name: Set current date as env variable
        id: date
        run: echo "date=$(date +"%Y%m%d_%H%M%S")" >> $GITHUB_OUTPUT

  build:
    needs: get_time
    permissions:
      contents: read
      packages: write
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        container: [
          {name: 'nce-php-fpm', context: './Containers/nextcloud'},
          {name: 'nce-php-fpm-mgmt', context: './Containers/nextcloud-management'},
          {name: 'nce-nginx', context: './Containers/nginx'}]

    steps:
      - name: Check out the repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NEXTCLOUD_RELEASES_PACKAGES_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: true
          platforms: linux/amd64
          context: ${{ matrix.container.context }}
          no-cache: true
          tags: ghcr.io/nextcloud-releases/${{ matrix.container.name }}:${{ needs.get_time.outputs.output1 }}
          provenance: false

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
  
      - name: Publish images on docker hub
        run: |
          docker buildx imagetools create --tag nextcloud/${{ matrix.container.name }}\:${{ needs.get_time.outputs.output1 }} ghcr.io/nextcloud-releases/${{ matrix.container.name }}\:${{ needs.get_time.outputs.output1 }}
